[pytest]
markers =
    smoke: короткий набор проверок «ничего не развалено» (быстрые критичные тесты)
    nav: навигация, Назад, В лагерь, слэш, single-window
    persist: save/load, active_story_callback в сейве, миграции
    mech: механики игры (костёр, крафт, еда, ловушки, AP, предметы)
    l1: сюжет локации 1 (Волчье логово, ручей, триггеры)
    l2: сюжет локации 2 (Чертополох, пролог, хижина)
    l3: сюжет локации 3 (Горное плато, планшет, буран)
    l4: сюжет локации 4 (Купол, армейская фляга, пещеры)
    l5: сюжет локации 5 (Каменоломни, разведка, гнездо)
    l6: сюжет локации 6 (Снежный пик, холод, меховая броня)
    slow: тяжёлые e2e тесты (длинные цепочки, scout, большие бои)
